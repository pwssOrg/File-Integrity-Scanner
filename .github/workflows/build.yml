name: Makefile CI

on:
  push:
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        ports:
          - 26556:5432
        env:
          POSTGRES_DB: integrity_hash
          POSTGRES_USER: coa
          POSTGRES_PASSWORD: the_dodo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'


    - name: Set DB environment variables
      run: |
        echo "INTEGRITY_HASH_DB_USER=coa" >> $GITHUB_ENV
        echo "INTEGRITY_HASH_DB_PASSWORD=the_dodo" >> $GITHUB_ENV


    - name: Install dependencies
      env:
          SPRING_PROFILES_ACTIVE: build
      run: make build
